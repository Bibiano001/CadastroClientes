spring.application.name=CadastroDeCliente

# Dados de conexao (valores padrao batem com o docker-compose.yml)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cadastro_clientes}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Documentacao da API: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
